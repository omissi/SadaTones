name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehydrate complete source project
        shell: bash
        run: |
          mkdir -p build/source
          cat project-zip/SadaTonesProject.b64.part* | tr -d '\n\r' > /tmp/SadaTonesProject.zip.b64
          base64 -d /tmp/SadaTonesProject.zip.b64 > /tmp/SadaTonesProject.zip
          unzip -t /tmp/SadaTonesProject.zip
          unzip -q /tmp/SadaTonesProject.zip -d build/source
          test -f build/source/settings.gradle
          test -f build/source/app/src/main/java/com/sadatones/app/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: build/source
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SadaTones-debug-apk
          path: build/source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload full source archive
        uses: actions/upload-artifact@v4
        with:
          name: SadaTones-source-project
          path: /tmp/SadaTonesProject.zip
